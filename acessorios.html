<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acessórios</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">

<style>

body{
font-family:'Roboto',sans-serif;
margin:0;
background:#fff0f5;
text-align:center;
}

header{
background:linear-gradient(90deg,#ff6f61,#ff9472);
color:white;
padding:30px;
}

header h1{
font-family:'Pacifico';
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-top:30px;
}

.card{
background:white;
padding:15px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card img{
width:100%;
border-radius:10px;
}

.card p{
font-weight:bold;
margin-top:10px;
}

.btn{
margin-top:30px;
padding:12px 20px;
border:none;
border-radius:25px;
background:linear-gradient(90deg,#ff6f61,#ff9472);
color:white;
cursor:pointer;
font-size:16px;
}

</style>
</head>

<body>

<header>
<h1>🎀 Acessórios das Pelúcias</h1>
<p>Veja os acessórios disponíveis para personalização</p>
</header>

<div class="container">

<div class="grid">

<div class="card">
<img src="imagensgpt/chapeu.png">
<p>Chapéu Fofo</p>
</div>

<div class="card">
<img src="imagensgpt/oculos.png">
<p>Óculos Estilosos</p>
</div>

<div class="card">
<img src="imagensgpt/gravata.png">
<p>Gravata</p>
</div>

<div class="card">
<img src="imagensgpt/coracao.png">
<p>Coração de Pelúcia</p>
</div>

<div class="card">
<img src="imagensgpt/laco.png">
<p>Laço Decorativo</p>
</div>

<div class="card">
<img src="imagensgpt/cachecol.png">
<p>Cachecol</p>
</div>

</div>

<a href="personalizar.html">
<button class="btn">⬅ Voltar para personalização</button>
</a>

</div>

</body>
</html>
