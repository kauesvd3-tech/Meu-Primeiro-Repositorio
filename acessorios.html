<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acessórios</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">

<style>

.btn-sair{
position:absolute;
top:20px;
right:20px;
padding:10px 20px;
border:none;
border-radius:25px;
background:linear-gradient(90deg,#ff6f61,#ff9472);
color:white;
cursor:pointer;
font-size:16px;
}
  
body{
font-family:'Roboto',sans-serif;
margin:0;
background:#fff0f5;
text-align:center;
}

header{
background:linear-gradient(90deg,#ff6f61,#ff9472);
color:white;
padding:30px;
}

header h1{
font-family:'Pacifico';
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-top:30px;
}

.card{
background:white;
padding:15px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
cursor:pointer;
transition:0.2s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
border-radius:10px;
}

.card p{
font-weight:bold;
margin-top:10px;
}

</style>

</head>

<body>

<button onclick="logout()" class="btn-sair">
🚪 Sair
</button>
  
<header>
<h1>🎀 Acessórios</h1>
<p>Escolha uma categoria</p>
</header>

<div class="container">

<div class="grid">

<div class="card" onclick="irPagina('chapeus.html')">
<img src="imagensgpt/chapeup.png">
<p>Chapéus</p>
</div>

<div class="card" onclick="irPagina('camisetas.html')">
<img src="imagensgpt/oculos.png">
<p>Camisetas</p>
</div>

<div class="card" onclick="irPagina('shorts.html')">
<img src="imagensgpt/gravata.png">
<p>Shorts</p>
</div>

<div class="card" onclick="irPagina('oculos.html')">
<img src="imagensgpt/coracao.png">
<p>Óculos</p>
</div>

<div class="card" onclick="irPagina('sapatos.html')">
<img src="imagensgpt/laco.png">
<p>Sapatoss</p>
</div>

<div class="card" onclick="irPagina('cachecois.html')">
<img src="imagensgpt/cachecol.png">
<p>Cachecóis</p>
</div>

</div>

</div>

<script>

  let usuario = localStorage.getItem("usuarioLogado")

if(!usuario){
window.location.href="login.html"
}
  
function irPagina(pagina){
window.location.href = pagina
}

</script>

</body>
</html>
