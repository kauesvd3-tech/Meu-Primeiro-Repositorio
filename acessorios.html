<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acessórios</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">

<style>

body{
font-family:'Roboto',sans-serif;
margin:0;
background:#fff0f5;
text-align:center;
}

header{
background:linear-gradient(90deg,#ff6f61,#ff9472);
color:white;
padding:30px;
}

header h1{
font-family:'Pacifico';
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-top:30px;
}

.card{
background:white;
padding:15px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
cursor:pointer;
transition:0.2s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
border-radius:10px;
}

.card p{
font-weight:bold;
margin-top:10px;
}

</style>
</head>

<body>

<header>
<h1>🎀 Acessórios</h1>
<p>Escolha uma categoria</p>
</header>

<div class="container">

<div class="grid">

<a href="chapeus.html">
<div class="card">
<img src="imagensgpt/chapeu.png">
<p>Chapéus</p>
</div>
</a>

<a href="oculos.html">
<div class="card">
<img src="imagensgpt/oculos.png">
<p>Óculos</p>
</div>
</a>

<a href="gravatas.html">
<div class="card">
<img src="imagensgpt/gravata.png">
<p>Gravatas</p>
</div>
</a>

<a href="coracoes.html">
<div class="card">
<img src="imagensgpt/coracao.png">
<p>Corações</p>
</div>
</a>

<a href="lacos.html">
<div class="card">
<img src="imagensgpt/laco.png">
<p>Laços</p>
</div>
</a>

<a href="cachecois.html">
<div class="card">
<img src="imagensgpt/cachecol.png">
<p>Cachecóis</p>
</div>
</a>

</div>

</div>

</body>
</html>

</body>
</html>
