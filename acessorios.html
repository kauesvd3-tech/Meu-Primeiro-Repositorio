<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acessórios</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">

<style>
body{
font-family:'Roboto',sans-serif;
margin:0;
background:#fff0f5;
}

/* HEADER */

header{
background:linear-gradient(90deg,#ff6f61,#ff9472);
color:white;
text-align:center;
padding:2rem;
}

header h1{
font-family:'Pacifico';
margin:0;
font-size:2.5rem;
}

/* BARRA DE BOTÕES */

.barra-botoes{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
padding:15px;
background:#fff0f5;
}

/* BOTÕES */

.btn{
padding:10px 20px;
border:none;
border-radius:25px;
background:linear-gradient(90deg,#ff6f61,#ff9472);
color:white;
cursor:pointer;
font-size:14px;
}

/* GRID */

.container{
max-width:1200px;
margin:auto;
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

/* CARD */

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 6px 15px rgba(0,0,0,0.1);
transition:.3s;
text-align:center;
padding:15px;
}

.card:hover{
transform:translateY(-10px);
}

.card img{
width:100%;
height:220px;
object-fit:contain;
}

/* FOOTER */

footer{
background:#333;
color:white;
text-align:center;
padding:30px;
margin-top:40px;
}

/* MOBILE */

@media(max-width:700px){

.container{
grid-template-columns:1fr;
}

.card img{
height:260px;
}

.btn{
width:100%;
}

}
<a href="personalizar.html">
<button class="btn">Voltar</button>
</a>
  
<header>
<h1>🎀 Acessórios</h1>
<p>Escolha uma categoria</p>
</header>

<div class="container">

<div class="grid">

<div class="card" onclick="irPagina('chapeus.html')">
<img src="imagensgpt/chapeup.png">
<p>Chapéus</p>
</div>

<div class="card" onclick="irPagina('camisetas.html')">
<img src="imagensgpt/oculos.png">
<p>Camisetas</p>
</div>

<div class="card" onclick="irPagina('shorts.html')">
<img src="imagensgpt/gravata.png">
<p>Shorts</p>
</div>

<div class="card" onclick="irPagina('oculos.html')">
<img src="imagensgpt/coracao.png">
<p>Óculos</p>
</div>

<div class="card" onclick="irPagina('sapatos.html')">
<img src="imagensgpt/laco.png">
<p>Sapatoss</p>
</div>

<div class="card" onclick="irPagina('cachecois.html')">
<img src="imagensgpt/cachecol.png">
<p>Cachecóis</p>
</div>

</div>

</div>

<script>

function voltarPagina(){
history.back()
}
  
function irPagina(pagina){
window.location.href = pagina
}

</script>

</body>
</html>
