body{

header{

.container{

}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.12);
    overflow:hidden;
    transition:.3s;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card p{
    font-size:20px;
    margin:18px 10px;
}

.btn{
    margin:0 20px 20px;
    padding:12px;
    border:none;
    border-radius:30px;
    background:linear-gradient(90deg,#ff6f61,#ff9472);
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    transform:scale(1.05);
}

.voltar{
    margin-top:40px;
}

</style>
