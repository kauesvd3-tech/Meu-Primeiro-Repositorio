<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Perfil</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">

<style>

body{
font-family:'Roboto',sans-serif;
margin:0;
background:#fff0f5;
}

header{
background:linear-gradient(90deg,#ff6f61,#ff9472);
color:white;
text-align:center;
padding:2rem;
}

header h1{
font-family:'Pacifico';
margin:0;
}

.perfil-container{
max-width:500px;
margin:40px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 6px 15px rgba(0,0,0,0.1);
text-align:center;
}

.foto{
width:120px;
height:120px;
border-radius:50%;
background:#ff69b4;
display:flex;
align-items:center;
justify-content:center;
font-size:50px;
color:white;
margin:auto;
}

.info{
margin-top:20px;
font-size:18px;
}

.btn{
padding:10px 20px;
border:none;
border-radius:25px;
background:linear-gradient(90deg,#ff6f61,#ff9472);
color:white;
cursor:pointer;
margin-top:15px;
}

.voltar{
position:fixed;
top:20px;
left:20px;
}

</style>
</head>

<body>

<header>
<h1>👤 Meu Perfil</h1>
</header>

<a href="index.html">
<button class="btn voltar">⬅ Voltar</button>
</a>

<div class="perfil-container">

<div class="foto">👤</div>

<div class="info">
<p><b>Usuário:</b> <span id="nomeUsuario"></span></p>
<p><b>Email:</b> <span id="emailUsuario"></span></p>
</div>

<button class="btn" onclick="logout()">🚪 Sair</button>

</div>

<script>

let usuario = localStorage.getItem("usuarioLogado")

if(!usuario){
window.location.href = "login.html"
}

document.getElementById("nomeUsuario").innerText = usuario

let email = localStorage.getItem("email_"+usuario)

if(email){
document.getElementById("emailUsuario").innerText = email
}else{
document.getElementById("emailUsuario").innerText = "Não informado"
}

function logout(){
localStorage.removeItem("logado")
window.location.href = "login.html"
}

</script>

</body>
</html>
