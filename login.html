<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Animaizinhos Encantados</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Roboto',sans-serif;
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(
        135deg,
        #ff9a9e,
        #fecfef
    );
}

.box{
    background:white;

    padding:30px;

    border-radius:20px;

    box-shadow:
        0 10px 25px rgba(0,0,0,0.2);

    width:320px;

    text-align:center;
}

h1{
    font-family:'Pacifico';

    color:#ff6f61;

    margin-bottom:25px;
}

input{
    width:100%;

    padding:12px;

    margin:8px 0;

    border-radius:20px;

    border:1px solid #ccc;

    box-sizing:border-box;

    outline:none;

    font-size:15px;
}

input:focus{
    border-color:#ff6f61;

    box-shadow:
        0 0 5px rgba(255,111,97,.3);
}

button{
    width:100%;

    padding:12px;

    margin-top:8px;

    border:none;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            #ff6f61,
            #ff9472
        );

    color:white;

    cursor:pointer;

    font-size:15px;

    transition:.3s;
}

button:hover{
    transform:scale(1.02);

    box-shadow:
        0 5px 12px rgba(0,0,0,.15);
}

button.secundario{
    background:#555;
}

button.telefone{
    background:
        linear-gradient(
            90deg,
            #ff69b4,
            #ff9472
        );
}

.toggle{
    margin-top:15px;

    color:#ff6f61;

    cursor:pointer;

    font-size:14px;
}

.erro{
    color:#e53935;

    font-size:14px;

    min-height:20px;
}

.sucesso{
    color:#2e7d32;

    font-size:14px;
}

.divisor{
    display:flex;

    align-items:center;

    gap:10px;

    margin:20px 0;

    color:#999;

    font-size:13px;
}

.divisor::before,
.divisor::after{
    content:"";

    flex:1;

    height:1px;

    background:#ddd;
}

.telefone-area{
    display:none;
}

.voltar-email{
    background:#777;
}

.info{
    font-size:13px;

    color:#777;

    margin-top:10px;
}

</style>

</head>

<body>

<div class="box">

    <h1 id="titulo">
        🧸 Login
    </h1>


    <!-- =========================
         LOGIN POR EMAIL
    ========================= -->

    <div id="areaEmail">

        <input
            type="email"
            id="email"
            placeholder="📧 Seu e-mail"
        >

        <input
            type="password"
            id="senha"
            placeholder="🔒 Sua senha"
        >

        <button onclick="entrarEmail()">
            Entrar
        </button>

        <button
            class="secundario"
            onclick="criarConta()"
        >
            ✨ Criar conta
        </button>

    </div>


    <div class="divisor">
        ou
    </div>


    <!-- =========================
         TELEFONE
    ========================= -->

    <button
        class="telefone"
        id="botaoTelefone"
        onclick="mostrarTelefone()"
    >
        📱 Entrar com telefone
    </button>


    <div
        class="telefone-area"
        id="areaTelefone"
    >

        <input
            type="tel"
            id="telefone"
            placeholder="+55 19 99999-9999"
        >

        <div
            id="recaptcha-container"
        ></div>

        <button
            onclick="enviarCodigo()"
        >
            📩 Enviar código SMS
        </button>


        <input
            type="text"
            id="codigo"
            placeholder="Digite o código recebido"
            style="display:none;"
        >


        <button
            id="confirmarCodigo"
            onclick="confirmarCodigo()"
            style="display:none;"
        >
            ✅ Confirmar código
        </button>


        <button
            class="voltar-email"
            onclick="voltarEmail()"
        >
            ← Voltar
        </button>

    </div>


    <p
        class="erro"
        id="erro"
    ></p>

    <p
        class="sucesso"
        id="sucesso"
    ></p>

    <p class="info">
        🔐 Seus dados de autenticação são protegidos pelo Firebase.
    </p>

</div>


<!-- ==========================================
     FIREBASE
========================================== -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signInWithPhoneNumber,
    RecaptchaVerifier,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* ==========================================
   CONFIGURAÇÃO DO FIREBASE

   COLOQUE AQUI OS DADOS DO SEU PROJETO
========================================== */

const firebaseConfig = {

    apiKey: "COLOQUE_SUA_API_KEY",

    authDomain:
        "SEU-PROJETO.firebaseapp.com",

    projectId:
        "SEU-PROJETO",

    storageBucket:
        "SEU-PROJETO.firebasestorage.app",

    messagingSenderId:
        "SEU_MESSAGING_SENDER_ID",

    appId:
        "SEU_APP_ID"

};


/* Inicializa Firebase */

const app =
    initializeApp(firebaseConfig);


/* Inicializa autenticação */

const auth =
    getAuth(app);


/* ==========================================
   ELEMENTOS
========================================== */

const erro =
    document.getElementById("erro");

const sucesso =
    document.getElementById("sucesso");


/* ==========================================
   MENSAGENS
========================================== */

function mostrarErro(mensagem){

    erro.innerText =
        mensagem;

    sucesso.innerText =
        "";

}


function mostrarSucesso(mensagem){

    sucesso.innerText =
        mensagem;

    erro.innerText =
        "";

}


/* ==========================================
   LOGIN POR EMAIL
========================================== */

window.entrarEmail = async function(){

    const email =
        document.getElementById("email").value.trim();

    const senha =
        document.getElementById("senha").value;


    if(!email || !senha){

        mostrarErro(
            "Preencha o e-mail e a senha."
        );

        return;
    }


    try{

        const resultado =
            await signInWithEmailAndPassword(
                auth,
                email,
                senha
            );


        const usuario =
            resultado.user;


        salvarUsuarioLocal(usuario);


        window.location.href =
            "index.html";


    }catch(error){

        console.error(error);

        tratarErroFirebase(error);

    }

};


/* ==========================================
   CRIAR CONTA
========================================== */

window.criarConta = async function(){

    const email =
        document.getElementById("email").value.trim();

    const senha =
        document.getElementById("senha").value;


    if(!email || !senha){

        mostrarErro(
            "Digite um e-mail e uma senha."
        );

        return;
    }


    if(senha.length < 6){

        mostrarErro(
            "A senha precisa ter pelo menos 6 caracteres."
        );

        return;
    }


    try{

        const resultado =
            await createUserWithEmailAndPassword(
                auth,
                email,
                senha
            );


        const usuario =
            resultado.user;


        salvarUsuarioLocal(usuario);


        mostrarSucesso(
            "Conta criada com sucesso! Entrando..."
        );


        setTimeout(() => {

            window.location.href =
                "index.html";

        },1000);


    }catch(error){

        console.error(error);

        tratarErroFirebase(error);

    }

};


/* ==========================================
   MOSTRAR LOGIN POR TELEFONE
========================================== */

window.mostrarTelefone = function(){

    document
        .getElementById("areaEmail")
        .style.display = "none";


    document
        .getElementById("botaoTelefone")
        .style.display = "none";


    document
        .querySelector(".divisor")
        .style.display = "none";


    document
        .getElementById("areaTelefone")
        .style.display = "block";


    document
        .getElementById("titulo")
        .innerText =
        "📱 Login por telefone";

};


/* ==========================================
   VOLTAR PARA EMAIL
========================================== */

window.voltarEmail = function(){

    document
        .getElementById("areaTelefone")
        .style.display = "none";


    document
        .getElementById("areaEmail")
        .style.display = "block";


    document
        .getElementById("botaoTelefone")
        .style.display = "block";


    document
        .querySelector(".divisor")
        .style.display = "flex";


    document
        .getElementById("titulo")
        .innerText =
        "🧸 Login";


    erro.innerText =
        "";

    sucesso.innerText =
        "";

};


/* ==========================================
   RECAPTCHA
========================================== */

let recaptchaVerifier;

let confirmationResult;


function prepararRecaptcha(){

    recaptchaVerifier =
        new RecaptchaVerifier(
            auth,
            "recaptcha-container",
            {

                size:"normal",

                callback: () => {

                    console.log(
                        "reCAPTCHA confirmado."
                    );

                },

                "expired-callback": () => {

                    mostrarErro(
                        "O reCAPTCHA expirou. Tente novamente."
                    );

                }

            }
        );

}


/* ==========================================
   ENVIAR SMS
========================================== */

window.enviarCodigo = async function(){

    const telefone =
        document
        .getElementById("telefone")
        .value
        .trim();


    if(!telefone){

        mostrarErro(
            "Digite seu número de telefone."
        );

        return;
    }


    /*
       O telefone precisa estar
       no formato internacional.

       Exemplo:

       +5519999999999
    */

    if(!telefone.startsWith("+")){

        mostrarErro(
            "Digite o telefone com código do país. Exemplo: +5519999999999"
        );

        return;
    }


    try{

        if(!recaptchaVerifier){

            prepararRecaptcha();

        }


        confirmationResult =
            await signInWithPhoneNumber(
                auth,
                telefone,
                recaptchaVerifier
            );


        document
        .getElementById("codigo")
        .style.display =
        "block";


        document
        .getElementById("confirmarCodigo")
        .style.display =
        "block";


        mostrarSucesso(
            "Código enviado por SMS!"
        );


    }catch(error){

        console.error(error);

        mostrarErro(
            "Não foi possível enviar o SMS."
        );

    }

};


/* ==========================================
   CONFIRMAR SMS
========================================== */

window.confirmarCodigo = async function(){

    const codigo =
        document
        .getElementById("codigo")
        .value
        .trim();


    if(!codigo){

        mostrarErro(
            "Digite o código recebido."
        );

        return;
    }


    if(!confirmationResult){

        mostrarErro(
            "Primeiro solicite o código por SMS."
        );

        return;
    }


    try{

        const resultado =
            await confirmationResult.confirm(
                codigo
            );


        const usuario =
            resultado.user;


        salvarUsuarioLocal(usuario);


        mostrarSucesso(
            "Telefone confirmado! Entrando..."
        );


        setTimeout(() => {

            window.location.href =
                "index.html";

        },1000);


    }catch(error){

        console.error(error);

        mostrarErro(
            "Código inválido ou expirado."
        );

    }

};


/* ==========================================
   SALVAR SESSÃO LOCAL
========================================== */

function salvarUsuarioLocal(usuario){

    localStorage.setItem(
        "logado",
        "true"
    );


    localStorage.setItem(
        "usuarioLogado",
        usuario.uid
    );


    localStorage.setItem(
        "emailUsuario",
        usuario.email || ""
    );


    localStorage.setItem(
        "telefoneUsuario",
        usuario.phoneNumber || ""
    );

}


/* ==========================================
   ERROS DO FIREBASE
========================================== */

function tratarErroFirebase(error){

    switch(error.code){

        case "auth/invalid-email":

            mostrarErro(
                "E-mail inválido."
            );

            break;


        case "auth/user-not-found":

            mostrarErro(
                "Usuário não encontrado."
            );

            break;


        case "auth/wrong-password":

            mostrarErro(
                "Senha incorreta."
            );

            break;


        case "auth/email-already-in-use":

            mostrarErro(
                "Este e-mail já está cadastrado."
            );

            break;


        case "auth/weak-password":

            mostrarErro(
                "A senha é muito fraca."
            );

            break;


        case "auth/too-many-requests":

            mostrarErro(
                "Muitas tentativas. Aguarde alguns minutos."
            );

            break;


        default:

            mostrarErro(
                "Não foi possível realizar a operação."
            );

    }

}


/* ==========================================
   VERIFICAR LOGIN
========================================== */

onAuthStateChanged(
    auth,
    usuario => {

        if(usuario){

            console.log(
                "Usuário conectado:",
                usuario.uid
            );

        }

    }
);

</script>

</body>

</html>
