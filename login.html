Página de Login

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Animaizinhos Encantados</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Roboto',sans-serif;
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ff9a9e,#fecfef);
}

.box{
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  width:320px;
  text-align:center;
}

h1{
  font-family:'Pacifico';
  color:#ff6f61;
}

input{
  width:100%;
  padding:10px;
  margin:10px 0;
  border-radius:20px;
  border:1px solid #ccc;
}

button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:20px;
  background:linear-gradient(90deg,#ff6f61,#ff9472);
  color:white;
  cursor:pointer;
}

.toggle{
  margin-top:10px;
  color:#ff6f61;
  cursor:pointer;
  font-size:14px;
}

.erro{
  color:red;
  font-size:14px;
}
</style>
</head>

<body>

<div class="box">

  <h1 id="titulo">🧸 Login</h1>

 <input type="text" id="nome" placeholder="Nome">
<input type="email" id="email" placeholder="Email">
  <input type="password" id="senha" placeholder="Senha">

  <button onclick="acao()">Entrar</button>

  <p class="toggle" onclick="trocarModo()">Não tem conta? Criar conta</p>
  <p class="erro" id="erro"></p>

</div>


  <script type="module">

import { auth, db } from './firebase-config.js'
import { createUserWithEmailAndPassword, signInWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"

import { doc, setDoc } 
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"

let modoLogin = true

window.trocarModo = function(){

  modoLogin = !modoLogin

  document.getElementById("titulo").innerText =
    modoLogin ? "🧸 Login" : "✨ Criar Conta"

  document.querySelector("button").innerText =
    modoLogin ? "Entrar" : "Cadastrar"

  document.querySelector(".toggle").innerText =
    modoLogin
    ? "Não tem conta? Criar conta"
    : "Já tem conta? Fazer login"
}

window.acao = async function(){

  const nome = document.getElementById("nome").value
  const email = document.getElementById("email").value
  const senha = document.getElementById("senha").value

  try{

    if(modoLogin){

      await signInWithEmailAndPassword(auth, email, senha)

      window.location.href = "index.html"

    }else{

      const userCredential =
      await createUserWithEmailAndPassword(auth, email, senha)

      const user = userCredential.user

      await setDoc(doc(db,"usuarios",user.uid),{
        nome:nome,
        email:email,
        criadoEm:new Date()
      })

      await setDoc(doc(db,"favoritos",user.uid),{itens:[]})
      await setDoc(doc(db,"carrinho",user.uid),{itens:[]})

      window.location.href = "index.html"

    }

  }catch(error){

    document.getElementById("erro").innerText =
    "Erro: " + error.message

  }

}

</script>

</body>
</html>

</body>
</html>
