<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
Login - Animaizinhos Encantados
</title>

<link
href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Pacifico&display=swap"
rel="stylesheet"
>

<link
rel="stylesheet"
href="fundo.css"
>

<style>

*{
    box-sizing:border-box;
}

body{

    font-family:'Roboto',sans-serif;

    margin:0;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
    linear-gradient(
        135deg,
        #ff9a9e,
        #fecfef
    );

    padding:20px;

}

.box{

    background:white;

    padding:35px;

    border-radius:25px;

    box-shadow:
    0 10px 30px
    rgba(0,0,0,.20);

    width:100%;

    max-width:400px;

    text-align:center;

}

h1{

    font-family:'Pacifico';

    color:#ff6f61;

    margin-top:0;

    margin-bottom:25px;

}

input{

    width:100%;

    padding:13px;

    margin:7px 0;

    border-radius:20px;

    border:1px solid #ddd;

    outline:none;

    font-size:15px;

}

input:focus{

    border-color:#ff6f61;

    box-shadow:
    0 0 5px
    rgba(255,111,97,.25);

}

button{

    width:100%;

    padding:13px;

    margin-top:10px;

    border:none;

    border-radius:20px;

    background:
    linear-gradient(
        90deg,
        #ff6f61,
        #ff9472
    );

    color:white;

    cursor:pointer;

    font-size:16px;

    font-weight:bold;

}

button:hover{

    opacity:.9;

    transform:scale(1.01);

}

.toggle{

    margin-top:18px;

    color:#ff6f61;

    cursor:pointer;

    font-size:14px;

}

.erro{

    color:#e53935;

    font-size:14px;

    min-height:20px;

}

.sucesso{

    color:#2e7d32;

    font-size:14px;

}

.separador{

    display:flex;

    align-items:center;

    gap:10px;

    margin:20px 0;

    color:#999;

    font-size:13px;

}

.separador::before,
.separador::after{

    content:"";

    height:1px;

    background:#ddd;

    flex:1;

}

.info-login{

    color:#777;

    font-size:13px;

    line-height:1.5;

}

.campo-cadastro{

    display:none;

}

.mostrar{

    display:block;

}

</style>

</head>


<body>


<div class="box">


<h1 id="titulo">
🧸 Login
</h1>


<!-- =========================
     CAMPOS DE LOGIN
========================= -->

<div id="loginCampos">


<input
type="text"
id="login"
placeholder="Usuário, e-mail ou telefone"
autocomplete="username"
>


<input
type="password"
id="senhaLogin"
placeholder="Senha"
autocomplete="current-password"
>


<button onclick="entrar()">

Entrar 🧸

</button>


<div class="separador">

ou

</div>


<p class="info-login">

Você pode entrar usando seu
<strong>usuário</strong>,
<strong>e-mail</strong> ou
<strong>telefone</strong>.

</p>


</div>


<!-- =========================
     CAMPOS DE CADASTRO
========================= -->

<div
id="cadastroCampos"
class="campo-cadastro"
>


<input
type="text"
id="novoUsuario"
placeholder="Nome de usuário"
>


<input
type="email"
id="novoEmail"
placeholder="E-mail"
>


<input
type="tel"
id="novoTelefone"
placeholder="Telefone (DDD + número)"
>


<input
type="password"
id="novaSenha"
placeholder="Criar senha"
>


<input
type="password"
id="confirmarSenha"
placeholder="Confirmar senha"
>


<button onclick="cadastrar()">

Criar minha conta ✨

</button>


</div>


<p
class="toggle"
id="toggle"
onclick="trocarModo()"
>

Não tem conta?
Criar conta

</p>


<p
class="erro"
id="erro"
></p>


<p
class="sucesso"
id="sucesso"
></p>


</div>


<script src="banco.js"></script>


<script>


let modoLogin = true;


/* =====================================================
   TROCAR LOGIN / CADASTRO
===================================================== */

function trocarModo(){

    modoLogin = !modoLogin;


    document
    .getElementById("erro")
    .innerText = "";


    document
    .getElementById("sucesso")
    .innerText = "";


    if(modoLogin){

        document
        .getElementById("titulo")
        .innerText =
        "🧸 Login";


        document
        .getElementById("loginCampos")
        .style.display =
        "block";


        document
        .getElementById("cadastroCampos")
        .classList.remove(
            "mostrar"
        );


        document
        .getElementById("toggle")
        .innerText =
        "Não tem conta? Criar conta";

    }

    else{

        document
        .getElementById("titulo")
        .innerText =
        "✨ Criar Conta";


        document
        .getElementById("loginCampos")
        .style.display =
        "none";


        document
        .getElementById("cadastroCampos")
        .classList.add(
            "mostrar"
        );


        document
        .getElementById("toggle")
        .innerText =
        "Já tem conta? Fazer login";

    }

}


/* =====================================================
   CADASTRAR
===================================================== */

function cadastrar(){

    const usuario =
    document
    .getElementById("novoUsuario")
    .value
    .trim();


    const email =
    document
    .getElementById("novoEmail")
    .value
    .trim()
    .toLowerCase();


    const telefone =
    document
    .getElementById("novoTelefone")
    .value
    .replace(/\D/g,"");


    const senha =
    document
    .getElementById("novaSenha")
    .value;


    const confirmar =
    document
    .getElementById("confirmarSenha")
    .value;


    const erro =
    document
    .getElementById("erro");


    const sucesso =
    document
    .getElementById("sucesso");


    erro.innerText = "";

    sucesso.innerText = "";


    /* =========================
       VALIDAÇÕES
    ========================= */


    if(
        !usuario ||
        !email ||
        !telefone ||
        !senha ||
        !confirmar
    ){

        erro.innerText =
        "Preencha todos os campos.";

        return;

    }


    if(
        !email.includes("@") ||
        !email.includes(".")
    ){

        erro.innerText =
        "Digite um e-mail válido.";

        return;

    }


    if(telefone.length < 10){

        erro.innerText =
        "Digite um telefone válido.";

        return;

    }


    if(senha.length < 6){

        erro.innerText =
        "A senha precisa ter pelo menos 6 caracteres.";

        return;

    }


    if(senha !== confirmar){

        erro.innerText =
        "As senhas não são iguais.";

        return;

    }


    /* =========================
       VERIFICAR DUPLICIDADE
    ========================= */

    if(
        BANCO.usuarioExiste(
            usuario,
            email,
            telefone
        )
    ){

        erro.innerText =
        "Usuário, e-mail ou telefone já cadastrado.";

        return;

    }


    /* =========================
       CRIAR USUÁRIO
    ========================= */

    const novoUsuario =
    BANCO.criarUsuario({

        usuario:
        usuario,

        email:
        email,

        telefone:
        telefone,

        senha:
        senha

    });


    /* =========================
       CRIAR DADOS DO USUÁRIO
    ========================= */

    localStorage.setItem(

        "carrinho_" +
        usuario,

        JSON.stringify([])

    );


    localStorage.setItem(

        "favoritos_" +
        usuario,

        JSON.stringify([])

    );


    /* =========================
       LOGIN AUTOMÁTICO
    ========================= */

    BANCO.fazerLogin(
        novoUsuario
    );


    sucesso.innerText =
    "Conta criada com sucesso!";


    setTimeout(() => {

        window.location.href =
        "index.html";

    },800);

}


/* =====================================================
   ENTRAR
===================================================== */

function entrar(){

    const login =
    document
    .getElementById("login")
    .value
    .trim();


    const senha =
    document
    .getElementById("senhaLogin")
    .value;


    const erro =
    document
    .getElementById("erro");


    erro.innerText = "";


    if(!login || !senha){

        erro.innerText =
        "Digite seu login e senha.";

        return;

    }


    const usuario =
    BANCO.procurarUsuario(
        login
    );


    if(!usuario){

        erro.innerText =
        "Usuário, e-mail ou telefone não encontrado.";

        return;

    }


    if(usuario.senha !== senha){

        erro.innerText =
        "Senha incorreta.";

        return;

    }


    /* =========================
       LOGIN
    ========================= */

    BANCO.fazerLogin(
        usuario
    );


    window.location.href =
    "index.html";

}


/* =====================================================
   ENTER PARA ENTRAR
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            modoLogin
        ){

            entrar();

        }

    }
);

</script>


</body>

</html>
