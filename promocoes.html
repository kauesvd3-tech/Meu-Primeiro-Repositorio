<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promoções - Loja de Ursos</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">

    <style>
       *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family:'Roboto',sans-serif;
        background:#fff4f7;
    }

    /* ================= HEADER ================= */
    header{
        background:linear-gradient(90deg,#ff6f61,#ff9472);
        color:white;
        text-align:center;
        padding:35px 20px;
        box-shadow:0 4px 15px rgba(0,0,0,.15);
    }

    header h1{
        font-family:'Pacifico',cursive;
        font-size:45px;
        margin-bottom:10px;
    }

    /* ================= CONTAINER GRID ================= */
    .container{
        max-width:1200px;
        margin:auto;
        padding:20px;
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
        gap:20px;
    }

    /* ================= CARD ================= */
    .card{ /* <-- Tinha "card" sem ponto */
        position:relative; /* pra fav funcionar */
        background:white;
        border-radius:15px;
        overflow:hidden;
        box-shadow:0 6px 15px rgba(0,0,0,0.1);
        transition:.3s;
    }

    .card:hover{
        transform:translateY(-10px);
    }

    .card img{
        width:100%;
        height:250px;
        object-fit:contain;
        background:white;
        padding:10px;
    }

    .card-body{
        padding:15px;
        text-align:center;
    }

    .card-body .btn{
        display:block;
        margin:10px auto 0;
        width:170px;
        min-width: 180px;
        height: 45px;
        border: none;
        border-radius: 25px;
        background: linear-gradient(90deg,#ff6f61,#ff9472);
        color: white;
        cursor: pointer;
        font-size: 15px;
    }
      
    .price{
        color:#ff6f61;
        font-weight:bold;
        font-size:1.2rem;
    }

    .preco-antigo{
        text-decoration: line-through;
        color:#999;
        font-size:0.9rem;
    }

    .stars{
        color:gold;
    }

    /* ================= FAVORITOS ================= */
    .fav{
        position:absolute;
        top:12px;
        right:12px;
        width:40px;
        height:40px;
        background:white;
        border-radius:50%;
        display:flex;
        justify-content:center;
        align-items:center;
        font-size:22px;
        cursor:pointer;
        box-shadow:0 4px 10px rgba(0,0,0,.2);
        z-index:2;
    }

    /* ================= RESPONSIVO ================= */
    @media(max-width:768px){
        .container{
            grid-template-columns:1fr;
        }
    }
    </style>
</head>
<body>

<header>
    <h1>🎉 Promoções Especiais 🎉</h1>
    <p>Aproveite nossos descontos!</p>
</header>

<div class="container">

    <div class="card">
        <div class="fav" onclick="favoritar(this)">🤍</div>
        <img src="imagensgpt/ursomarrom.png" alt="Teddy Fofo">
        <div class="card-body">
            <h2>Teddy Fofo</h2>
            <p class="stars">⭐⭐⭐</p>
            <p class="preco-antigo">R$ 230,00</p>
            <p class="price">R$ 199,99</p>
            <button class="btn">Comprar</button>
        </div>
    </div>

    <div class="card">
        <div class="fav" onclick="favoritar(this)">🤍</div>
        <img src="imagensgpt/macaco.png" alt="Macaco Greg">
        <div class="card-body">
            <h2>Macaco Greg</h2>
            <p class="stars">⭐</p>
            <p class="preco-antigo">R$ 75,00</p>
            <p class="price">R$ 69,00</p>
            <button class="btn">Comprar</button>
        </div>
    </div>

    <div class="card">
        <div class="fav" onclick="favoritar(this)">🤍</div>
        <img src="imagensgpt/giraffa.png" alt="Girafa Nina">
        <div class="card-body">
            <h2>Girafa Nina</h2>
            <p class="stars">⭐⭐⭐⭐</p>
            <p class="preco-antigo">R$ 105,00</p>
            <p class="price">R$ 95,00</p>
            <button class="btn">Comprar</button>
        </div>
    </div>

</div>

</body>
</html>
